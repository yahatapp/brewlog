name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Install pinned Vite+
        run: nix develop --command ./scripts/setup-vp.sh

      - name: Install dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: nix develop --command pnpm run check

      - name: Run tests
        run: nix develop --command pnpm test

      - name: Build production bundle
        run: nix develop --command pnpm run build

      - name: Audit production dependencies
        run: nix develop --command pnpm audit --prod --audit-level high
